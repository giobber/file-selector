<!doctype html>
<html>
  <head>
    <title>File Selector</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css"
    />
  </head>
  <body class="pv3 ph3">
    <h1 class="tc">
      <a class="near-black link" href="/">File Selector</a>
    </h1>
    <header class="pv3 flex flex-row justify-center w-100">
      <form hx-post="/hx/table" hx-target="#main" hx-swap="innerHTML">
        <input name="sub_path" type="text" />
        <button type="submit">Go</button>
      </form>
    </header>
    <main
      id="main"
      class="w-100 overflow-x-auto"
      hx-get="/hx/table/{{ sub_path }}"
      hx-trigger="load"
    ></main>
  </body>
</html>
